---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - git
      - gnupg
      - lsb-release
      - python3
      - python3-pip
      - python3-venv
      - ufw
      - jq
      - htop
      - unzip
    state: present

- name: Create application directory
  ansible.builtin.file:
    path: "{{ hermes_app_dir }}"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"

- name: Create Hermes data directory
  ansible.builtin.file:
    path: "{{ hermes_data_dir }}"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0750"
